                  <div>
                    <label class="form-label" for="newRepName">Full Name *</label>
                    <input id="newRepName" class="form-control" placeholder="e.g. Rohan Mehta" />
                  </div>
                  <div>
                    <label class="form-label" for="newRepEmail">Email *</label>
                    <input id="newRepEmail" class="form-control" type="email" placeholder="rohan@vantagecrm.io" />
                  </div>
                  <div>
                    <label class="form-label" for="newRepRegion">Region</label>
                    <input id="newRepRegion" class="form-control" placeholder="e.g. India North" />
                  </div>
                  <div>
                    <label class="form-label" for="newRepRole">Role</label>
                    <input id="newRepRole" class="form-control" placeholder="Account Executive" />
                  </div>
                </div>
                <div style="margin-top:12px;">
                  <button id="addRepSubmitBtn" class="btn btn-primary btn-sm">Add Representative</button>
                </div>
              </div>
            </div>

            <!-- Sources, Theme & Storage -->
            <div style="display:flex;flex-direction:column;gap:20px;">
              <div class="surface-card">
                <div class="surface-header">
                  <div>
                    <h2 class="surface-title">Lead Sources (${state.sources.length})</h2>
                    <p class="surface-meta">Attribution channels available in forms &amp; filters</p>
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
                  ${state.sources.map((src) => `
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-subtle);border-radius:6px;">
                      <span style="font-weight:500;">${esc(src)}</span>
                      <button class="btn btn-ghost btn-sm" style="color:var(--status-red);min-height:26px;padding:2px 8px;" data-remove-src="${esc(src)}" ${state.sources.length <= 1 ? 'disabled' : ''}>Remove</button>
                    </div>
                  `).join('')}
                </div>
                <div style="display:flex;gap:8px;">
                  <input id="newSourceInput" class="form-control" placeholder="e.g. Partner Network" />
                  <button id="addSourceBtn" class="btn btn-secondary btn-sm">Add Source</button>
                </div>
              </div>

              <div class="surface-card">
                <div class="surface-header">
                  <div>
                    <h2 class="surface-title">Appearance &amp; Data</h2>
                    <p class="surface-meta">Theme preferences and local storage management</p>
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;gap:14px;">
                  <div style="display:flex;align-items:center;justify-content:space-between;">
                    <div>
                      <div style="font-weight:500;">Color Theme</div>
                      <div style="font-size:12px;color:var(--text-muted);">Choose Light or Dark interface</div>
                    </div>
                    <div style="display:flex;gap:6px;">
                      <button id="setLightBtn" class="btn btn-sm ${state.theme === 'light' ? 'btn-primary' : 'btn-secondary'}">Light</button>
                      <button id="setDarkBtn" class="btn btn-sm ${state.theme === 'dark' ? 'btn-primary' : 'btn-secondary'}">Dark</button>
                    </div>
                  </div>

                  <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-hairline);">
                    <div>
                      <div style="font-weight:500;">Compact Lead Table Rows</div>
                      <div style="font-size:12px;color:var(--text-muted);">Increase row density on the Leads grid</div>
                    </div>
                    <label class="switch">
                      <input type="checkbox" id="compactToggle" ${state.compactTable ? 'checked' : ''} />
                      <span class="slider"></span>
                    </label>
                  </div>

                  <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-hairline);">
                    <div>
                      <div style="font-weight:500;">Import Test CSV Dataset</div>
                      <div style="font-size:12px;color:var(--text-muted);">Upload another CSV file to append or replace leads</div>
                    </div>
                    <button id="settingsUploadCsvBtn" class="btn btn-secondary btn-sm">Upload CSV</button>
                  </div>

                  <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-hairline);">
                    <div>
                      <div style="font-weight:500;">Restore 2,200 Seeded Demo Leads</div>
                      <div style="font-size:12px;color:var(--text-muted);">Reset localStorage back to initial dataset</div>
                    </div>
                    <button id="resetDemoBtn" class="btn btn-danger btn-sm">Reset Data</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        document.getElementById('addRepSubmitBtn').addEventListener('click', () => {
          const name = document.getElementById('newRepName').value.trim();
          const email = document.getElementById('newRepEmail').value.trim();
          const region = document.getElementById('newRepRegion').value.trim() || 'Global';
          const role = document.getElementById('newRepRole').value.trim() || 'Account Executive';
          if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            return showToast('Enter a valid rep name and email', 'error');
          }
          if (state.reps.some((r) => r.name.toLowerCase() === name.toLowerCase())) {
            return showToast('Representative already exists', 'error');
          }
          state.reps.push({ id: 'rep-' + Date.now(), name, email, region, role });
          saveState(state);
          renderSettingsPage();
          showToast(`Added rep ${name}`);
        });

        main.querySelectorAll('[data-remove-rep]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.reps.length <= 1) return;
            state.reps = state.reps.filter((r) => r.id !== btn.dataset.removeRep);
            saveState(state);
            renderSettingsPage();
            showToast('Removed representative');
          });
        });

        document.getElementById('addSourceBtn').addEventListener('click', () => {
          const val = document.getElementById('newSourceInput').value.trim();
          if (!val) return showToast('Enter a source name', 'error');
          if (state.sources.some((s) => s.toLowerCase() === val.toLowerCase())) {
            return showToast('Source already exists', 'error');
          }
          state.sources.push(val);
          saveState(state);
          renderSettingsPage();
          showToast(`Added source "${val}"`);
        });

        main.querySelectorAll('[data-remove-src]').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.sources.length <= 1) return;
            state.sources = state.sources.filter((s) => s !== btn.dataset.removeSrc);
            saveState(state);
            renderSettingsPage();
            showToast('Removed lead source');
          });
        });

        document.getElementById('setLightBtn').addEventListener('click', () => { applyTheme('light'); renderSettingsPage(); });
        document.getElementById('setDarkBtn').addEventListener('click', () => { applyTheme('dark'); renderSettingsPage(); });
        document.getElementById('compactToggle').addEventListener('change', (e) => {
          state.compactTable = e.target.checked;
          saveState(state);
          showToast(`Compact table ${state.compactTable ? 'enabled' : 'disabled'}`, 'info');
        });

        document.getElementById('settingsUploadCsvBtn').addEventListener('click', () => openCsvImportModal());

        document.getElementById('resetDemoBtn').addEventListener('click', () => {
          openConfirmModal({
            title: 'Reset Demo Workspace',
            message: 'This will restore all 2,200 seeded leads, tasks, and automation rules back to their initial state.',
            confirmLabel: 'Reset Workspace',
            danger: true,
            onConfirm: () => {
              state = generateInitialState();
              saveState(state);
              ui.selectedLeadIds.clear();
              applyTheme(state.theme);
              syncSidebarCounts();
              renderNotifications();
              renderSettingsPage();
              showToast('Restored 2,200 seeded leads');
            }
          });
        });
      }

      /* =======================================================================
         15. MASTER RENDER DISPATCHER & BOOTSTRAP
         ======================================================================= */
      function renderActivePage() {
        switch (ui.page) {
          case 'dashboard': renderDashboard(); break;
          case 'leads': renderLeadsPage(); break;
          case 'pipeline': renderPipelinePage(); break;
          case 'automation': renderAutomationPage(); break;
          case 'tasks': renderTasksPage(); break;
          case 'reports': renderReportsPage(); break;
          case 'settings': renderSettingsPage(); break;
          default: renderDashboard();
        }
      }

      // Initialize application
      applyTheme(state.theme || 'light');
      syncSidebarCounts();
      renderNotifications();
      renderActivePage();
    })();
  </script>
</body>
</html>

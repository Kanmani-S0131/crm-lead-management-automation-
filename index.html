<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantage CRM — Lead Management &amp; Automation</title>
  <meta name="description" content="Self-contained CRM Lead Management and Automation platform with 2,200+ seeded leads, interactive Kanban pipeline, rule-based automation engine, tasks, reports, and Chart.js analytics." />
  <meta property="og:title" content="Vantage CRM — Lead Management &amp; Automation" />
  <meta property="og:description" content="Self-contained CRM Lead Management and Automation platform with 2,200+ seeded leads, interactive Kanban pipeline, rule-based automation engine, tasks, reports, and Chart.js analytics." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Typography: Plus Jakarta Sans (Display), DM Sans (UI/Body), JetBrains Mono (Tabular Data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Chart.js from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* =========================================================================
       1. DESIGN TOKENS & THEME VARIABLES (60-30-10 COLOR ARCHITECTURE)
       ========================================================================= */
    :root {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-hover: #e2e8f0;
      --bg-input: #ffffff;
      --border-hairline: #e2e8f0;
      --border-strong: #cbd5e1;

      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --text-inverse: #ffffff;

      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: rgba(37, 99, 235, 0.09);

      --status-green: #16a34a;
      --status-green-bg: rgba(22, 163, 74, 0.1);
      --status-amber: #d97706;
      --status-amber-bg: rgba(217, 119, 6, 0.1);
      --status-red: #dc2626;
      --status-red-bg: rgba(220, 38, 38, 0.1);
      --status-blue: #0284c7;
      --status-blue-bg: rgba(2, 132, 199, 0.1);

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 18px 42px rgba(15, 23, 42, 0.14);

      --font-display: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;

      --sidebar-w: 252px;
      --topbar-h: 60px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --transition-fast: 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.dark {
      --bg-canvas: #0b1120;
      --bg-surface: #111827;
      --bg-subtle: #1e293b;
      --bg-hover: #283548;
      --bg-input: #0f172a;
      --border-hairline: #1f2937;
      --border-strong: #334155;

      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-inverse: #ffffff;

      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-subtle: rgba(59, 130, 246, 0.14);

      --status-green: #22c55e;
      --status-green-bg: rgba(34, 197, 94, 0.14);
      --status-amber: #f59e0b;
      --status-amber-bg: rgba(245, 158, 11, 0.14);
      --status-red: #ef4444;
      --status-red-bg: rgba(239, 68, 68, 0.14);
      --status-blue: #38bdf8;
      --status-blue-bg: rgba(56, 189, 248, 0.14);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 22px 48px rgba(0, 0, 0, 0.55);
    }

    /* =========================================================================
       2. RESET & BASE TYPOGRAPHY
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      margin: 0;
      color: var(--text-primary);
      letter-spacing: -0.015em;
    }

    p { margin: 0; }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       3. APP SHELL: SIDEBAR + TOPBAR + MAIN WORKSPACE
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transition: transform var(--transition-fast);
    }

    .sidebar-brand {
      height: var(--topbar-h);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-hairline);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
      min-width: 0;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      border-radius: 6px;
      padding: 2px 4px;
      background-color: transparent;
      transition: background-color var(--transition-fast);
    }

    html.dark .brand-logo-wrap {
      background-color: #ffffff;
      padding: 4px 8px;
    }

    .brand-logo-img {
      height: 36px;
      width: auto;
      max-width: 190px;
      object-fit: contain;
      display: block;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background-color: var(--accent);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 40px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-item:hover {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
    }

    .nav-item.active {
      background-color: var(--accent-subtle);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-count {
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .nav-item.active .nav-count {
      color: var(--accent);
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border-hairline);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .main-area {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      height: var(--topbar-h);
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      cursor: pointer;
      flex-shrink: 0;
    }

    .breadcrumb {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 15px;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .topbar-search-wrap {
      position: relative;
      flex: 1;
      max-width: 440px;
    }

    .topbar-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .topbar-search-input {
      width: 100%;
      height: 38px;
      padding: 0 36px 0 36px;
      background-color: var(--bg-subtle);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 13px;
      transition: background-color var(--transition-fast), border-color var(--transition-fast);
    }

    .topbar-search-input:focus {
      outline: none;
      background-color: var(--bg-input);
      border-color: var(--accent);
    }

    .topbar-search-kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .global-search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-height: 360px;
      overflow-y: auto;
      z-index: 60;
      display: none;
    }

    .global-search-dropdown.open {
      display: block;
    }

    .search-result-item {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-bottom: 1px solid var(--border-hairline);
      background: transparent;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background-color: var(--bg-subtle); }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      position: relative;
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color var(--transition-fast), color var(--transition-fast);
    }

    .icon-btn:hover {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
    }

    .notif-count-label {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 4px;
      background-color: var(--accent);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .profile-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 10px 0 6px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color var(--transition-fast);
    }

    .profile-btn:hover { background-color: var(--bg-subtle); }

    .avatar-sq {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      background-color: var(--accent);
      color: #ffffff;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* =========================================================================
       4. BUTTONS, FORMS & SURFACE CARDS (SINGLE-ELEVATION HAIRLINE)
       ========================================================================= */
    .workspace {
      padding: 24px;
      max-width: 1520px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
      text-wrap: balance;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .page-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-weight: 500;
      font-size: 13px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }

    .btn-sm {
      min-height: 32px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover { background-color: var(--accent-hover); }

    .btn-secondary {
      background-color: var(--bg-surface);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .btn-secondary:hover { background-color: var(--bg-subtle); }

    .btn-danger {
      background-color: var(--status-red);
      color: #ffffff;
    }
    .btn-danger:hover { filter: brightness(0.92); }

    .btn-ghost {
      background-color: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background-color: var(--bg-subtle);
      color: var(--text-primary);
    }

    .surface-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 20px;
    }

    .surface-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .surface-title {
      font-size: 15px;
      font-weight: 600;
    }

    .surface-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 13px;
      transition: border-color var(--transition-fast);
    }

    textarea.form-control {
      height: auto;
      padding: 10px 12px;
      resize: vertical;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-control.invalid {
      border-color: var(--status-red);
    }

    .form-error {
      font-size: 12px;
      color: var(--status-red);
      margin-top: 4px;
    }

    /* =========================================================================
       5. DASHBOARD: KPI GRID, CHARTS & LEADERBOARD
       ========================================================================= */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }

    .kpi-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .kpi-value {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .kpi-foot {
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .charts-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .charts-grid-3 {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
    }

    .chart-box {
      position: relative;
      height: 280px;
      width: 100%;
    }

    /* =========================================================================
       6. DATA TABLES & HIGH-DENSITY LEADS VIEW
       ========================================================================= */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
      padding: 16px 20px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      min-width: 140px;
      flex: 1 1 160px;
    }

    .filter-field.search-wide {
      flex: 2 1 240px;
    }

    .bulk-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 18px;
      background-color: var(--accent-subtle);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
    }

    .bulk-bar.visible {
      display: flex;
    }

    .table-wrap {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    table.data-table th {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg-subtle);
      border-bottom: 1px solid var(--border-hairline);
      white-space: nowrap;
      user-select: none;
    }

    table.data-table th.sortable {
      cursor: pointer;
    }

    table.data-table th.sortable:hover {
      color: var(--text-primary);
    }

    table.data-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-hairline);
      vertical-align: middle;
      color: var(--text-primary);
    }

    table.data-table.compact td {
      padding: 7px 12px;
    }

    table.data-table tbody tr:hover {
      background-color: var(--bg-subtle);
    }

    table.data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .num-col {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .lead-name-btn {
      background: none;
      border: none;
      padding: 0;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .lead-name-btn:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .cell-sub {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Status text (zero-pill discipline: clean unboxed semantic typography with crisp text) */
    .status-text {
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }
    .status-Won { color: var(--status-green); }
    .status-Lost { color: var(--status-red); }
    .status-Proposal-Sent, .status-Negotiation { color: var(--status-amber); }
    .status-New, .status-Contacted, .status-Qualified { color: var(--status-blue); }

    .score-inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .score-meter {
      width: 44px;
      height: 5px;
      background-color: var(--bg-hover);
      border-radius: 3px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      background-color: var(--accent);
    }

    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--border-hairline);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .page-btn-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* =========================================================================
       7. KANBAN PIPELINE BOARD
       ========================================================================= */
    .kanban-board {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      align-items: flex-start;
    }

    .kanban-col {
      flex: 0 0 278px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 230px);
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
    }

    .kanban-col.drag-over {
      border-color: var(--accent);
      background-color: var(--accent-subtle);
    }

    .kanban-col-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .kanban-col-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
    }

    .kanban-col-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .kanban-cards {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
    }

    .kanban-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 12px;
      cursor: grab;
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }

    .kanban-card:hover {
      border-color: var(--accent);
    }

    .kanban-card.dragging {
      opacity: 0.5;
    }

    .kanban-card-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
    }

    .kanban-card-title:hover {
      color: var(--accent);
    }

    .kanban-card-company {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .kanban-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-hairline);
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       8. AUTOMATION, TASKS & SETTINGS GRIDS
       ========================================================================= */
    .split-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .rule-row {
      padding: 16px 0;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .rule-row:last-child { border-bottom: none; padding-bottom: 0; }
    .rule-row:first-child { padding-top: 0; }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--border-strong);
      border-radius: 12px;
      transition: background-color var(--transition-fast);
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform var(--transition-fast);
    }

    .switch input:checked + .slider {
      background-color: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }

    .activity-item {
      padding: 11px 0;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .activity-item:last-child { border-bottom: none; padding-bottom: 0; }
    .activity-item:first-child { padding-top: 0; }

    /* =========================================================================
       9. DRAWER, MODALS, POPOVERS & TOASTS
       ========================================================================= */
    .backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(15, 23, 42, 0.48);
      z-index: 70;
      display: none;
    }

    .backdrop.open { display: block; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(540px, 100vw);
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-lg);
      z-index: 80;
      transform: translateX(100%);
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .drawer.open { transform: translateX(0); }

    .drawer-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: rgba(15, 23, 42, 0.52);
    }

    .modal-wrap.open { display: flex; }

    .modal-panel {
      width: min(560px, 100%);
      max-height: 90vh;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-panel.modal-wide {
      width: min(820px, 100%);
    }

    .csv-dropzone {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-md);
      background-color: var(--bg-subtle);
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color var(--transition-fast), background-color var(--transition-fast);
    }

    .csv-dropzone:hover,
    .csv-dropzone.dragover {
      border-color: var(--accent);
      background-color: var(--accent-subtle);
    }

    .csv-map-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 680px) {
      .csv-map-grid { grid-template-columns: 1fr; }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .popover {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 340px;
      max-width: calc(100vw - 24px);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 65;
      display: none;
    }

    .popover.open { display: block; }

    .toast-stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      min-width: 260px;
      max-width: 380px;
      padding: 12px 16px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: var(--text-primary);
      animation: toastIn 160ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast-type {
      font-weight: 600;
      font-size: 12px;
      margin-right: 6px;
    }
    .toast-success .toast-type { color: var(--status-green); }
    .toast-error .toast-type { color: var(--status-red); }
    .toast-info .toast-type { color: var(--accent); }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .detail-kv-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .detail-kv-val {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-word;
    }

    /* =========================================================================
       10. RESPONSIVE BREAKPOINTS
       ========================================================================= */
    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .charts-grid-3, .split-layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .sidebar.mobile-open {
        transform: translateX(0);
      }
      .main-area {
        margin-left: 0;
      }
      .mobile-menu-btn {
        display: inline-flex;
      }
      .charts-grid-2 {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 680px) {
      .workspace { padding: 16px; }
      .topbar { padding: 0 14px; }
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid-2, .detail-grid { grid-template-columns: 1fr; }
      .profile-name-hide { display: none; }
      .topbar-search-kbd { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

        const a = new Date(isoA + 'T00:00:00Z').getTime();

      function generateInitialState() {

          { s: 'Won', w: 0.10 },
          { s: 'Lost', w: 0.06 }
        ];
        const pickStatus = () => {
          const r = rng();
          let acc = 0;
          for (const item of statusWeights) {
            acc += item.w;
            if (r <= acc) return item.s;
          }
          return 'New';
        };

          const company = rng() < 0.3 ? `${baseCompany} Group` : baseCompany;
          const domain = baseCompany.toLowerCase().replace(/[^a-z0-9]/g, '') + '.com';
          const emailPrefix = `${first}.${last}`.toLowerCase().replace(/[^a-z.]/g, '');

          if (status === 'Negotiation' || status === 'Won') baseScore += 15;

      /* =======================================================================
         3. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE (WITH TRY/CATCH)
         ======================================================================= */
      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.leads) && parsed.leads.length > 0) {
              return parsed;
            }
          }
        } catch (err) {
          console.warn('Failed to load state from localStorage:', err);
        }
        const fresh = generateInitialState();
        saveState(fresh);
        return fresh;
      }

      function saveState(nextState) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));

          console.warn('Failed to persist state to localStorage:', err);
        }

          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmtCurrency(n) {

      function showToast(message, type = 'success') {
        const stack = document.getElementById('toastStack');
        const el = document.createElement('div');
        el.className = `toast toast-${type}`;
        const label = type === 'error' ? 'Error' : type === 'info' ? 'Notice' : 'Saved';
        el.innerHTML = `
          <div><span class="toast-type">${label}</span><span>${esc(message)}</span></div>
          <button class="btn btn-ghost btn-sm" style="padding:2px 6px;min-height:24px;" aria-label="Dismiss">&times;</button>
        `;
        el.querySelector('button').addEventListener('click', () => el.remove());
        stack.appendChild(el);
        setTimeout(() => {
          if (el.parentNode) el.remove();
        }, 3800);

        if (state.activities.length > 60) state.activities.length = 60;

        document.getElementById('themeIconSun').style.display = state.theme === 'dark' ? 'block' : 'none';

        if (ui.page === 'dashboard') {
          renderDashboardCharts();

      function downloadCSV(filename, headers, rows) {
        const csvCell = (val) => {
          const s = String(val ?? '');
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const lines = [headers.map(csvCell).join(',')];
        for (const r of rows) {
          lines.push(r.map(csvCell).join(','));
        }
        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

         5. MODAL & CONFIRMATION HELPERS

        modalPanel.classList.toggle('modal-wide', Boolean(wide));

        modalBody.innerHTML = bodyHtml;
        modalFooter.innerHTML = footerHtml;
        modalBackdrop.classList.add('open');
      }

      function closeModal() {
        modalBackdrop.classList.remove('open');
        modalPanel.classList.remove('modal-wide');
        modalBody.innerHTML = '';
        modalFooter.innerHTML = '';
      }

      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
      modalBackdrop.addEventListener('click', (e) => {

      function openConfirmModal({ title, message, confirmLabel = 'Confirm', danger = false, onConfirm }) {

        });

      function computeDashboardStats() {
        const leads = state.leads;
        const total = leads.length;
        const weekCutoff = addDaysStr(REFERENCE_TODAY, -7);
        let newThisWeek = 0;
        let wonCount = 0;
        let lostCount = 0;
        let revenueWon = 0;
        let pipelineValue = 0;

        const bySource = {};
        const byStatus = {};
        STATUSES.forEach((s) => (byStatus[s] = 0));

        const repMap = {};
        state.reps.forEach((r) => {
          repMap[r.name] = { name: r.name, total: 0, won: 0, revenue: 0, pipeline: 0 };
        });

        // Monthly trend buckets (last 12 months)
        const monthLabels = [];
        const monthKeys = [];
        const refD = new Date(REFERENCE_TODAY + 'T00:00:00Z');
        for (let m = 11; m >= 0; m--) {
          const d = new Date(Date.UTC(refD.getUTCFullYear(), refD.getUTCMonth() - m, 1));
          const key = d.toISOString().slice(0, 7);
          monthKeys.push(key);
          monthLabels.push(d.toLocaleString('en-US', { month: 'short', year: '2-digit', timeZone: 'UTC' }));
        }
        const monthLeadCounts = new Array(12).fill(0);
        const monthWonRev = new Array(12).fill(0);

        for (let i = 0; i < total; i++) {
          const l = leads[i];
          if (l.createdDate >= weekCutoff) newThisWeek++;
          if (l.status === 'Won') {
            wonCount++;
            revenueWon += l.dealValue;
          } else if (l.status === 'Lost') {
            lostCount++;
          } else {
            pipelineValue += l.dealValue;
          }

          bySource[l.source] = (bySource[l.source] || 0) + 1;
          byStatus[l.status] = (byStatus[l.status] || 0) + 1;

          if (!repMap[l.assignedRep]) {
            repMap[l.assignedRep] = { name: l.assignedRep, total: 0, won: 0, revenue: 0, pipeline: 0 };
          }
          repMap[l.assignedRep].total++;
          if (l.status === 'Won') {
            repMap[l.assignedRep].won++;
            repMap[l.assignedRep].revenue += l.dealValue;
          } else if (l.status !== 'Lost') {
            repMap[l.assignedRep].pipeline += l.dealValue;
          }

          const mk = l.createdDate.slice(0, 7);
          const idx = monthKeys.indexOf(mk);
          if (idx !== -1) {
            monthLeadCounts[idx]++;
            if (l.status === 'Won') monthWonRev[idx] += l.dealValue;
          }
        }

        const closedCount = wonCount + lostCount;
        const conversionRate = closedCount > 0 ? ((wonCount / closedCount) * 100) : 0;

        const leaderboard = Object.values(repMap).sort((a, b) => b.revenue - a.revenue);

        return {
          total,
          newThisWeek,
          wonCount,
          lostCount,
          conversionRate,
          revenueWon,
          pipelineValue,
          bySource,
          byStatus,
          monthLabels,
          monthLeadCounts,
          monthWonRev,
          leaderboard
        };
      }

      function getFilteredSortedLeads() {
        const f = ui.leadsFilter;
        const q = f.search.trim().toLowerCase();

        const filtered = state.leads.filter((l) => {
          if (f.status !== 'All' && l.status !== f.status) return false;
          if (f.source !== 'All' && l.source !== f.source) return false;
          if (f.rep !== 'All' && l.assignedRep !== f.rep) return false;
          if (f.dateFrom && l.createdDate < f.dateFrom) return false;
          if (f.dateTo && l.createdDate > f.dateTo) return false;
          if (f.scoreBucket === 'hot' && l.score < 80) return false;
          if (f.scoreBucket === 'warm' && (l.score < 50 || l.score >= 80)) return false;
          if (f.scoreBucket === 'cold' && l.score >= 50) return false;
          if (q) {
            const hay = `${l.id} ${l.fullName} ${l.email} ${l.company} ${l.jobTitle} ${l.cityCountry}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const { key, dir } = ui.leadsSort;
        const mult = dir === 'asc' ? 1 : -1;
        filtered.sort((a, b) => {
          const av = a[key];
          const bv = b[key];
          if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * mult;
          return String(av).localeCompare(String(bv)) * mult;
        });

        return filtered;
      }

          renderActivePage();

          }

          }

      }

      /* =======================================================================
         9B. CSV UPLOAD & TEST-CASE IMPORTER
         ======================================================================= */
      function parseCSVText(rawText) {
        const text = String(rawText || '').replace(/^\uFEFF/, '');
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (text[i + 1] === '"') {
                field += '"';
                i++;
              } else {
                inQuotes = false;
              }
            } else {
              field += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field.trim());
            field = '';
          } else if (ch === '\r') {
            if (text[i + 1] === '\n') i++;
            row.push(field.trim());
            if (row.some((cell) => cell !== '')) rows.push(row);
            row = [];
            field = '';
          } else if (ch === '\n') {
            row.push(field.trim());
            if (row.some((cell) => cell !== '')) rows.push(row);
            row = [];
            field = '';
          } else {
            field += ch;
          }
        }
        row.push(field.trim());
        if (row.some((cell) => cell !== '')) rows.push(row);
        return rows;
      }

      const CSV_FIELD_DEFS = [
        { key: 'fullName', label: 'Full Name *', aliases: ['fullname', 'full name', 'name', 'lead name', 'contact name', 'customer'] },
        { key: 'email', label: 'Email', aliases: ['email', 'email address', 'e-mail', 'mail'] },
        { key: 'phone', label: 'Phone', aliases: ['phone', 'phone number', 'mobile', 'tel', 'telephone', 'contact'] },
        { key: 'company', label: 'Company', aliases: ['company', 'organization', 'org', 'account', 'business'] },
        { key: 'jobTitle', label: 'Job Title', aliases: ['jobtitle', 'job title', 'title', 'role', 'designation', 'position'] },
        { key: 'cityCountry', label: 'City / Country', aliases: ['citycountry', 'city/country', 'city', 'location', 'region', 'country'] },
        { key: 'source', label: 'Lead Source', aliases: ['source', 'lead source', 'channel', 'origin'] },
        { key: 'status', label: 'Status', aliases: ['status', 'pipeline status', 'stage', 'lead status'] },
        { key: 'score', label: 'Lead Score (0-100)', aliases: ['score', 'lead score', 'rating', 'points'] },
        { key: 'dealValue', label: 'Deal Value', aliases: ['dealvalue', 'deal value', 'value', 'amount', 'revenue', 'deal size'] },
        { key: 'assignedRep', label: 'Assigned Rep', aliases: ['assignedrep', 'assigned rep', 'rep', 'owner', 'sales rep', 'assignee'] },
        { key: 'createdDate', label: 'Created Date', aliases: ['createddate', 'created date', 'created', 'date'] },
        { key: 'lastContactedDate', label: 'Last Contacted', aliases: ['lastcontacteddate', 'last contacted', 'last contacted date', 'last contact'] },
        { key: 'notes', label: 'Notes', aliases: ['notes', 'note', 'comments', 'comment', 'description'] }
      ];

      function autoDetectColumnMap(headers) {
        const norm = headers.map((h) => String(h || '').toLowerCase().replace(/[^a-z0-9/ ]/g, '').trim());
        const map = {};
        CSV_FIELD_DEFS.forEach((def) => {
          let idx = norm.findIndex((h) => def.aliases.includes(h));
          if (idx === -1) {
            idx = norm.findIndex((h) => def.aliases.some((a) => h.includes(a)));
          }
          map[def.key] = idx;
        });
        return map;
      }

      function normalizeCsvStatus(raw) {
        const val = String(raw || '').trim().toLowerCase();
        if (!val) return 'New';
        const match = STATUSES.find((s) => s.toLowerCase() === val);
        if (match) return match;
        if (val.includes('prop')) return 'Proposal Sent';
        if (val.includes('neg')) return 'Negotiation';
        if (val.includes('qual')) return 'Qualified';
        if (val.includes('cont')) return 'Contacted';
        if (val.includes('won') || val.includes('clos')) return 'Won';
        if (val.includes('lost') || val.includes('disq')) return 'Lost';
        return 'New';
      }

      function normalizeCsvDate(raw, fallback) {
        const s = String(raw || '').trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        const parsed = new Date(s);
        if (s && !Number.isNaN(parsed.getTime())) {
          return parsed.toISOString().slice(0, 10);
        }
        return fallback;
      }

      /* =======================================================================
         11. PAGE 4: AUTOMATION ENGINE, RULE BUILDER & EMAIL TEMPLATES
         ======================================================================= */
      function evaluateTrigger(lead, rule) {
        const val = rule.triggerValue;
        switch (rule.triggerField) {
          case 'cityCountry': {
            const hay = lead.cityCountry.toLowerCase();
            return rule.triggerOp === 'equals' ? hay === val.toLowerCase() : hay.includes(val.toLowerCase());
          }
          case 'source':
            return lead.source.toLowerCase() === val.toLowerCase();
          case 'status':
            return lead.status.toLowerCase() === val.toLowerCase();
          case 'score': {
            const num = Number(val);
            return rule.triggerOp === 'gt' ? lead.score > num : lead.score < num;
          }
          case 'dealValue': {
            const num = Number(val);
            return rule.triggerOp === 'gt' ? lead.dealValue > num : lead.dealValue < num;
          }
          case 'daysSinceContact': {
            if (lead.status === 'Won' || lead.status === 'Lost') return false;
            const days = daysBetween(lead.lastContactedDate, REFERENCE_TODAY);
            const num = Number(val);
            return rule.triggerOp === 'gt' ? days > num : days < num;
          }
          default:
            return false;
        }
      }

      function runAutomationEngine() {
        const activeRules = state.rules.filter((r) => r.enabled);
        const logEntries = [];
        let totalActions = 0;

        for (const rule of activeRules) {
          let matchedCount = 0;
          let appliedCount = 0;
          const sampleLeads = [];

          for (let i = 0; i < state.leads.length; i++) {
            const lead = state.leads[i];
            if (!evaluateTrigger(lead, rule)) continue;
            matchedCount++;

            if (!Array.isArray(lead.appliedRules)) lead.appliedRules = [];

            if (rule.actionType === 'assignRep') {
              if (lead.assignedRep !== rule.actionValue) {
                lead.assignedRep = rule.actionValue;
                lead.timeline.unshift({ id: 't-' + Date.now() + i, type: 'Automation', text: `Auto-assigned to ${rule.actionValue} (${rule.name})`, date: REFERENCE_TODAY });
                appliedCount++;
                if (sampleLeads.length < 3) sampleLeads.push(lead.fullName);
              }
            } else if (rule.actionType === 'adjustScore') {
              if (!lead.appliedRules.includes(rule.id)) {
                const delta = Number(rule.actionValue) || 0;
                lead.score = Math.max(0, Math.min(100, lead.score + delta));
                lead.appliedRules.push(rule.id);
                lead.timeline.unshift({ id: 't-' + Date.now() + i, type: 'Automation', text: `Score adjusted ${delta >= 0 ? '+' : ''}${delta} (${rule.name})`, date: REFERENCE_TODAY });
                appliedCount++;
                if (sampleLeads.length < 3) sampleLeads.push(lead.fullName);
              }
            } else if (rule.actionType === 'moveStatus') {
              if (lead.status !== rule.actionValue && lead.status !== 'Won' && lead.status !== 'Lost') {
                lead.status = rule.actionValue;
                lead.timeline.unshift({ id: 't-' + Date.now() + i, type: 'Automation', text: `Auto-moved to ${rule.actionValue} (${rule.name})`, date: REFERENCE_TODAY });
                appliedCount++;
                if (sampleLeads.length < 3) sampleLeads.push(lead.fullName);
              }
            } else if (rule.actionType === 'createTask') {
              const taskExists = state.tasks.some((t) => !t.completed && t.leadId === lead.id && t.title.includes('[Auto]'));
              if (!taskExists && appliedCount < 25) {
                // Cap batch task creation to 25 most urgent leads per run to keep task queue actionable
                state.tasks.unshift({
                  id: 'TSK-' + (1000 + state.tasks.length + appliedCount),
                  title: `[Auto] Follow up with ${lead.company}`,
                  leadId: lead.id,
                  leadName: lead.fullName,
                  dueDate: addDaysStr(REFERENCE_TODAY, 1),
                  priority: rule.actionValue || 'High',
                  assignedRep: lead.assignedRep,
                  completed: false
                });
                lead.timeline.unshift({ id: 't-' + Date.now() + i, type: 'Automation', text: `Auto-created follow-up task (${rule.name})`, date: REFERENCE_TODAY });
                appliedCount++;
                if (sampleLeads.length < 3) sampleLeads.push(lead.fullName);
              }
            } else if (rule.actionType === 'sendEmail') {
              if (!lead.appliedRules.includes(rule.id)) {
                const tpl = state.emailTemplates.find((t) => t.id === rule.actionValue) || state.emailTemplates[0];
                lead.appliedRules.push(rule.id);
                lead.lastContactedDate = REFERENCE_TODAY;
                lead.timeline.unshift({ id: 't-' + Date.now() + i, type: 'Automation', text: `Simulated email "${tpl ? tpl.name : 'Template'}" dispatched`, date: REFERENCE_TODAY });
                appliedCount++;
                if (sampleLeads.length < 3) sampleLeads.push(lead.fullName);
              }
            }
          }

          rule.runCount = (rule.runCount || 0) + 1;
          totalActions += appliedCount;
          logEntries.push({
            ruleName: rule.name,
            matchedCount,
            appliedCount,
            sampleLeads
          });
        }

        const summary = {
          ranAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          rulesExecuted: activeRules.length,
          totalActions,
          entries: logEntries
        };
        state.lastAutomationLog = summary;
        logActivity(`Executed ${activeRules.length} automation rules (${totalActions} updates applied)`, 'automation');
        addNotification(`Automation run finished: ${totalActions} updates applied`);
        saveState(state);
        syncSidebarCounts();
        return summary;
      }

      function describeRule(rule) {
        const fieldLabels = {
          cityCountry: 'City / Country',
          source: 'Lead Source',
          status: 'Status',
          score: 'Lead Score',
          dealValue: 'Deal Value',
          daysSinceContact: 'Days Since Last Contact'
        };
        const opLabels = { contains: 'contains', equals: 'equals', gt: '>', lt: '<' };
        const actionLabels = {
          assignRep: `Assign Rep to ${rule.actionValue}`,
          adjustScore: `Adjust Score by ${Number(rule.actionValue) >= 0 ? '+' : ''}${rule.actionValue}`,
          moveStatus: `Move Status to ${rule.actionValue}`,
          createTask: `Create ${rule.actionValue} Priority Follow-up Task`,
          sendEmail: `Send Template (${(state.emailTemplates.find(t => t.id === rule.actionValue) || {}).name || rule.actionValue})`
        };
        return `IF ${fieldLabels[rule.triggerField] || rule.triggerField} ${opLabels[rule.triggerOp] || rule.triggerOp} "${rule.triggerValue}" THEN ${actionLabels[rule.actionType] || rule.actionType}`;
      }

          } else if (t === 'createTask') {

            valWrap.innerHTML = `<label class="form-label" for="rbActVal">Email Template</label><select id="rbActVal" class="form-control">${state.emailTemplates.map(tpl => `<option value="${esc(tpl.id)}">${esc(tpl.name)}</option>`).join('')}</select>`;
          }
        };

        document.getElementById('rbSave').addEventListener('click', () => {

          const triggerValue = document.getElementById('rbVal').value.trim();

          document.getElementById('errRbVal').textContent = '';

          if (!name) { document.getElementById('errRbName').textContent = 'Rule name is required.'; ok = false; }
          if (!triggerValue) { document.getElementById('errRbVal').textContent = 'Trigger value is required.'; ok = false; }
          if (!ok) return;

          state.rules.push({
            id: 'rule-' + Date.now(),
            name,
            enabled: true,
            triggerField: document.getElementById('rbField').value,
            triggerOp: document.getElementById('rbOp').value,
            triggerValue,
            actionType: actionSel.value,
            actionValue: document.getElementById('rbActVal').value,
            runCount: 0
          });
          saveState(state);
          syncSidebarCounts();
          closeModal();
          renderAutomationPage();
          showToast(`Created automation rule "${name}"`);
        });
      }

      /* =======================================================================
         12. PAGE 5: TASKS (FOLLOW-UPS, PRIORITIES, DUE DATES, COMPLETION)
         ======================================================================= */
      function renderTasksPage() {
        destroyCharts();
        const tf = ui.tasksFilter;
        const q = tf.search.trim().toLowerCase();

        const filtered = state.tasks.filter((t) => {
          if (tf.status === 'Pending' && t.completed) return false;
          if (tf.status === 'Completed' && !t.completed) return false;
          if (tf.status === 'Overdue' && (t.completed || t.dueDate >= REFERENCE_TODAY)) return false;
          if (tf.priority !== 'All' && t.priority !== tf.priority) return false;
          if (tf.rep !== 'All' && t.assignedRep !== tf.rep) return false;
          if (q && !`${t.title} ${t.leadName} ${t.assignedRep}`.toLowerCase().includes(q)) return false;
          return true;
        });

        filtered.sort((a, b) => Number(a.completed) - Number(b.completed) || a.dueDate.localeCompare(b.dueDate));

        const main = document.getElementById('appMain');
        main.innerHTML = `
          <div class="page-header">
            <div>
              <h1 class="page-title">Follow-Up Tasks</h1>
              <p class="page-subtitle">${state.tasks.filter(t => !t.completed).length} pending tasks · ${state.tasks.filter(t => !t.completed && t.dueDate < REFERENCE_TODAY).length} overdue.</p>
            </div>
            <div class="page-actions">
              <button id="addTaskBtn" class="btn btn-primary">+ New Task</button>
            </div>
          </div>

          <div class="filter-bar">
            <div class="filter-field search-wide">
              <label class="form-label" for="tfSearch">Search Tasks</label>
              <input id="tfSearch" class="form-control" type="search" value="${esc(tf.search)}" placeholder="Task title, lead name, rep..." />
            </div>
            <div class="filter-field">
              <label class="form-label" for="tfStatus">Status</label>
              <select id="tfStatus" class="form-control">
                <option value="All" ${tf.status === 'All' ? 'selected' : ''}>All Tasks</option>
                <option value="Pending" ${tf.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Overdue" ${tf.status === 'Overdue' ? 'selected' : ''}>Overdue</option>
                <option value="Completed" ${tf.status === 'Completed' ? 'selected' : ''}>Completed</option>
              </select>
            </div>
            <div class="filter-field">
              <label class="form-label" for="tfPriority">Priority</label>
              <select id="tfPriority" class="form-control">
                <option value="All" ${tf.priority === 'All' ? 'selected' : ''}>All Priorities</option>
                <option value="High" ${tf.priority === 'High' ? 'selected' : ''}>High</option>
                <option value="Medium" ${tf.priority === 'Medium' ? 'selected' : ''}>Medium</option>
                <option value="Low" ${tf.priority === 'Low' ? 'selected' : ''}>Low</option>
              </select>
            </div>
            <div class="filter-field">
              <label class="form-label" for="tfRep">Assigned Rep</label>
              <select id="tfRep" class="form-control">
                <option value="All">All Reps</option>
                ${state.reps.map((r) => `<option value="${esc(r.name)}" ${tf.rep === r.name ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="table-wrap">
            ${filtered.length === 0 ? `
              <div class="empty-state">
                <strong style="color:var(--text-primary);">No follow-up tasks found</strong>
                <span>Create a task manually or run the 7-day stale lead automation rule.</span>
                <button id="emptyAddTaskBtn" class="btn btn-primary btn-sm">+ Create Task</button>
              </div>
            ` : `
              <div class="table-scroll">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th style="width:42px;">Done</th>
                      <th>Task</th>
                      <th>Related Lead</th>
                      <th>Priority</th>
                      <th>Due Date</th>
                      <th>Assigned Rep</th>
                      <th style="text-align:right;">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.map((t) => {
                      const overdue = !t.completed && t.dueDate < REFERENCE_TODAY;
                      const priColor = t.priority === 'High' ? 'var(--status-red)' : t.priority === 'Medium' ? 'var(--status-amber)' : 'var(--text-muted)';
                      return `
                        <tr style="${t.completed ? 'opacity:0.6;' : ''}">
                          <td><input type="checkbox" class="task-done-cb" data-task-id="${esc(t.id)}" ${t.completed ? 'checked' : ''} aria-label="Mark ${esc(t.title)} complete" /></td>
                          <td style="${t.completed ? 'text-decoration:line-through;' : 'font-weight:500;'}">${esc(t.title)}</td>
                          <td><button class="lead-name-btn" data-open-task-lead="${esc(t.leadId)}">${esc(t.leadName)}</button></td>
                          <td><span style="font-weight:600;font-size:12px;color:${priColor};">${esc(t.priority)}</span></td>
                          <td class="mono" style="font-size:12px;color:${overdue ? 'var(--status-red)' : 'var(--text-secondary)'};">
                            ${esc(t.dueDate)}${overdue ? ' (Overdue)' : ''}
                          </td>
                          <td>${esc(t.assignedRep)}</td>
                          <td style="text-align:right;">
                            <button class="btn btn-ghost btn-sm" style="color:var(--status-red);" data-del-task="${esc(t.id)}">Delete</button>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        `;

        document.getElementById('addTaskBtn').addEventListener('click', () => openTaskFormModal());
        const emptyAdd = document.getElementById('emptyAddTaskBtn');
        if (emptyAdd) emptyAdd.addEventListener('click', () => openTaskFormModal());

        const tfSearch = document.getElementById('tfSearch');
        tfSearch.addEventListener('input', () => {
          ui.tasksFilter.search = tfSearch.value;
          renderTasksPage();
          const ref = document.getElementById('tfSearch');
          if (ref) { ref.focus(); ref.setSelectionRange(ref.value.length, ref.value.length); }
        });
        document.getElementById('tfStatus').addEventListener('change', (e) => { ui.tasksFilter.status = e.target.value; renderTasksPage(); });
        document.getElementById('tfPriority').addEventListener('change', (e) => { ui.tasksFilter.priority = e.target.value; renderTasksPage(); });
        document.getElementById('tfRep').addEventListener('change', (e) => { ui.tasksFilter.rep = e.target.value; renderTasksPage(); });

        main.querySelectorAll('.task-done-cb').forEach((cb) => {
          cb.addEventListener('change', () => {
            const task = state.tasks.find((t) => t.id === cb.dataset.taskId);
            if (!task) return;
            task.completed = cb.checked;
            logActivity(`Task "${task.title}" marked ${task.completed ? 'completed' : 'pending'}`, 'task');
            saveState(state);
            syncSidebarCounts();
            renderTasksPage();
            showToast(task.completed ? 'Task completed' : 'Task reopened');
          });
        });

        main.querySelectorAll('[data-open-task-lead]').forEach((btn) => {
          btn.addEventListener('click', () => openLeadDrawer(btn.dataset.openTaskLead));
        });

        main.querySelectorAll('[data-del-task]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.tasks = state.tasks.filter((t) => t.id !== btn.dataset.delTask);
            saveState(state);
            syncSidebarCounts();
            renderTasksPage();
            showToast('Task deleted');
          });
        });
      }

      function openTaskFormModal(prefill = {}) {
        const leadOptions = state.leads.slice(0, 80);
        if (prefill.leadId && !leadOptions.some((l) => l.id === prefill.leadId)) {
          const found = state.leads.find((l) => l.id === prefill.leadId);
          if (found) leadOptions.unshift(found);
        }

        openModal({
          title: 'Create Follow-Up Task',
          bodyHtml: `
            <div style="display:flex;flex-direction:column;gap:14px;">
              <div>
                <label class="form-label" for="tkTitle">Task Description *</label>
                <input id="tkTitle" class="form-control" placeholder="e.g. Call to confirm annual pricing terms" />
                <div class="form-error" id="errTkTitle"></div>
              </div>
              <div>
                <label class="form-label" for="tkLead">Related Lead *</label>
                <select id="tkLead" class="form-control">
                  ${leadOptions.map((l) => `<option value="${esc(l.id)}" ${prefill.leadId === l.id ? 'selected' : ''}>${esc(l.fullName)} · ${esc(l.company)} (${esc(l.id)})</option>`).join('')}
                </select>
              </div>
              <div class="form-grid-2">
                <div>
                  <label class="form-label" for="tkDue">Due Date *</label>
                  <input id="tkDue" class="form-control" type="date" value="${addDaysStr(REFERENCE_TODAY, 1)}" />
                </div>
                <div>
                  <label class="form-label" for="tkPriority">Priority</label>
                  <select id="tkPriority" class="form-control">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="form-label" for="tkRep">Assigned Rep</label>
                <select id="tkRep" class="form-control">
                  ${state.reps.map((r) => `<option value="${esc(r.name)}">${esc(r.name)}</option>`).join('')}
                </select>
              </div>
            </div>
          `,
          footerHtml: `
            <button id="tkCancel" class="btn btn-secondary">Cancel</button>
            <button id="tkSave" class="btn btn-primary">Create Task</button>
          `
        });

        document.getElementById('tkCancel').addEventListener('click', closeModal);
        document.getElementById('tkSave').addEventListener('click', () => {
          const title = document.getElementById('tkTitle').value.trim();
          const leadId = document.getElementById('tkLead').value;
          const dueDate = document.getElementById('tkDue').value || REFERENCE_TODAY;
          const priority = document.getElementById('tkPriority').value;
          const assignedRep = document.getElementById('tkRep').value;
          if (!title) {
            document.getElementById('errTkTitle').textContent = 'Task description is required.';
            return;
          }
          const lead = state.leads.find((l) => l.id === leadId);
          state.tasks.unshift({
            id: 'TSK-' + (1000 + state.tasks.length + 1),
            title,
            leadId,
            leadName: lead ? lead.fullName : leadId,
            dueDate,
            priority,
            assignedRep,
            completed: false
          });
          if (lead) {
            lead.timeline.unshift({ id: 't-' + Date.now(), type: 'Task', text: `Follow-up scheduled: ${title} (Due ${dueDate})`, date: REFERENCE_TODAY });
          }
          logActivity(`Created task "${title}" for ${lead ? lead.fullName : leadId}`, 'task');
          saveState(state);
          syncSidebarCounts();
          closeModal();
          renderActivePage();
          showToast('Follow-up task created');
        });
      }

      /* =======================================================================
         13. PAGE 6: REPORTS (FILTERABLE SUMMARY TABLES & DOWNLOADABLE CSV)
         ======================================================================= */
      function renderReportsPage() {
        destroyCharts();
        const rf = ui.reportsFilter;
        const subset = state.leads.filter((l) => {
          if (rf.rep !== 'All' && l.assignedRep !== rf.rep) return false;
          if (rf.source !== 'All' && l.source !== rf.source) return false;
          if (rf.dateFrom && l.createdDate < rf.dateFrom) return false;
          if (rf.dateTo && l.createdDate > rf.dateTo) return false;
          return true;
        });

        // Build grouped summaries
        const groupBy = (key) => {
          const map = {};
          subset.forEach((l) => {
            const k = l[key];
            if (!map[k]) map[k] = { label: k, total: 0, won: 0, lost: 0, wonRev: 0, pipeVal: 0, scoreSum: 0 };
            map[k].total++;
            map[k].scoreSum += l.score;
            if (l.status === 'Won') { map[k].won++; map[k].wonRev += l.dealValue; }
            else if (l.status === 'Lost') { map[k].lost++; }
            else { map[k].pipeVal += l.dealValue; }
          });
          return Object.values(map).sort((a, b) => b.wonRev - a.wonRev);
        };

        const bySource = groupBy('source');
        const byRep = groupBy('assignedRep');
        const byGeo = groupBy('cityCountry');

        const main = document.getElementById('appMain');
        main.innerHTML = `
          <div class="page-header">
            <div>
              <h1 class="page-title">Analytics &amp; Export Reports</h1>
              <p class="page-subtitle">Filtered across ${subset.length.toLocaleString()} leads · Download any breakdown or the raw filtered dataset.</p>
            </div>
            <div class="page-actions">
              <button id="repExportRawBtn" class="btn btn-primary">Download Filtered CSV (${subset.length.toLocaleString()})</button>
            </div>
          </div>

          <div class="filter-bar">
            <div class="filter-field">
              <label class="form-label" for="rfFrom">Created From</label>
              <input id="rfFrom" class="form-control" type="date" value="${esc(rf.dateFrom)}" />
            </div>
            <div class="filter-field">
              <label class="form-label" for="rfTo">Created To</label>
              <input id="rfTo" class="form-control" type="date" value="${esc(rf.dateTo)}" />
            </div>
            <div class="filter-field">
              <label class="form-label" for="rfRep">Sales Rep</label>
              <select id="rfRep" class="form-control">
                <option value="All">All Reps</option>
                ${state.reps.map((r) => `<option value="${esc(r.name)}" ${rf.rep === r.name ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}
              </select>
            </div>
            <div class="filter-field">
              <label class="form-label" for="rfSource">Source</label>
              <select id="rfSource" class="form-control">
                <option value="All">All Sources</option>
                ${state.sources.map((s) => `<option value="${esc(s)}" ${rf.source === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
              </select>
            </div>
            <div>
              <button id="rfResetBtn" class="btn btn-secondary">Reset</button>
            </div>
          </div>

          ${[
            { id: 'source', title: 'Attribution by Lead Source', rows: bySource },
            { id: 'rep', title: 'Performance by Sales Representative', rows: byRep },
            { id: 'geo', title: 'Geographic Market Breakdown (City / Country)', rows: byGeo }
          ].map((sec) => `
            <div class="surface-card">
              <div class="surface-header">
                <h2 class="surface-title">${sec.title}</h2>
                <button class="btn btn-secondary btn-sm" data-csv-sec="${sec.id}">Export Summary CSV</button>
              </div>
              <div class="table-scroll">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Segment</th>
                      <th class="num-col">Leads</th>
                      <th class="num-col">Won</th>
                      <th class="num-col">Lost</th>
                      <th class="num-col">Win Rate</th>
                      <th class="num-col">Avg Score</th>
                      <th class="num-col">Open Pipeline</th>
                      <th class="num-col">Won Revenue</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${sec.rows.map((r) => {
                      const closed = r.won + r.lost;
                      const winPct = closed > 0 ? ((r.won / closed) * 100).toFixed(1) : '0.0';
                      const avgScore = r.total ? (r.scoreSum / r.total).toFixed(1) : '0.0';
                      return `
                        <tr>
                          <td style="font-weight:600;">${esc(r.label)}</td>
                          <td class="num-col mono">${r.total.toLocaleString()}</td>
                          <td class="num-col mono">${r.won.toLocaleString()}</td>
                          <td class="num-col mono">${r.lost.toLocaleString()}</td>
                          <td class="num-col mono">${winPct}%</td>
                          <td class="num-col mono">${avgScore}</td>
                          <td class="num-col mono">${fmtCurrency(r.pipeVal)}</td>
                          <td class="num-col mono" style="font-weight:600;color:var(--status-green);">${fmtCurrency(r.wonRev)}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `).join('')}
        `;

        document.getElementById('rfFrom').addEventListener('change', (e) => { ui.reportsFilter.dateFrom = e.target.value; renderReportsPage(); });
        document.getElementById('rfTo').addEventListener('change', (e) => { ui.reportsFilter.dateTo = e.target.value; renderReportsPage(); });
        document.getElementById('rfRep').addEventListener('change', (e) => { ui.reportsFilter.rep = e.target.value; renderReportsPage(); });
        document.getElementById('rfSource').addEventListener('change', (e) => { ui.reportsFilter.source = e.target.value; renderReportsPage(); });
        document.getElementById('rfResetBtn').addEventListener('click', () => {
          ui.reportsFilter = { dateFrom: '', dateTo: '', rep: 'All', source: 'All' };
          renderReportsPage();
        });

        document.getElementById('repExportRawBtn').addEventListener('click', () => {
          const headers = ['ID', 'Full Name', 'Email', 'Phone', 'Company', 'Job Title', 'City/Country', 'Source', 'Status', 'Score', 'Deal Value', 'Assigned Rep', 'Created Date', 'Last Contacted'];
          const rows = subset.map((l) => [l.id, l.fullName, l.email, l.phone, l.company, l.jobTitle, l.cityCountry, l.source, l.status, l.score, l.dealValue, l.assignedRep, l.createdDate, l.lastContactedDate]);
          downloadCSV(`vantage-report-leads-${REFERENCE_TODAY}.csv`, headers, rows);
          showToast(`Downloaded ${subset.length.toLocaleString()} filtered rows`);
        });

        const secMap = { source: bySource, rep: byRep, geo: byGeo };
        main.querySelectorAll('[data-csv-sec]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const sec = btn.dataset.csvSec;
            const list = secMap[sec] || [];
            const headers = ['Segment', 'Total Leads', 'Won', 'Lost', 'Win Rate %', 'Avg Score', 'Open Pipeline USD', 'Won Revenue USD'];
            const rows = list.map((r) => {
              const closed = r.won + r.lost;
              return [
                r.label, r.total, r.won, r.lost,
                closed > 0 ? ((r.won / closed) * 100).toFixed(1) : '0.0',
                r.total ? (r.scoreSum / r.total).toFixed(1) : '0.0',
                r.pipeVal, r.wonRev
              ];
            });
            downloadCSV(`vantage-summary-${sec}-${REFERENCE_TODAY}.csv`, headers, rows);
            showToast(`Exported ${sec} summary CSV`);
          });
        });
      }
